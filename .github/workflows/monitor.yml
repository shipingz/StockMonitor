name: A股15分钟K线MA60监控

on:
  # 交易时段每 5 分钟触发一次（ADR-0003 修订 / ADR-0016，UTC 时区，北京时间 = UTC+8）
  # 北京 9:30–11:55 = UTC 1:30–3:55；北京 13:00–15:55 = UTC 5:00–7:55
  # 精确裁剪由脚本内护栏完成：非交易时段（9:30 前/15:10 后）退出；9:30–9:45 由「最新K线必须是今天」拦截
  schedule:
    - cron: '*/5 1-3 * * 1-5'     # 北京时间 9:30–11:55
    - cron: '*/5 5-7 * * 1-5'     # 北京时间 13:00–15:55

  # 手动触发（ADR-0012）：dry_run 只计算不推送；force_run 跳过交易日检查
  # 复盘模式（ADR-0013）：replay 计算最近一个完整交易日当天全部信号（非交易日验证用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run：抓取与计算但不推送任何消息'
        required: false
        default: false
        type: boolean
      force_run:
        description: '强制运行（跳过交易日历检查）'
        required: false
        default: false
        type: boolean
      replay:
        description: '复盘模式：计算最近一个完整交易日当天全部信号（非交易日验证用）'
        required: false
        default: false
        type: boolean
      replay_date:
        description: '复盘目标日期 YYYY-MM-DD（留空自动取最近完整交易日）'
        required: false
        default: ''
        type: string

# 防止同一 workflow 并发运行（ADR-0003）
concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 随机延迟（避免固定时间集中访问数据源）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行监控
        env:
          # 机密走 Secrets（ADR-0009）；推送渠道有哪个推哪个（ADR-0014）
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          # 配置走 Variables（兼容 Secrets，三段式）
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ inputs.force_run || 'false' }}
          REPLAY: ${{ inputs.replay || 'false' }}
          REPLAY_DATE: ${{ inputs.replay_date || '' }}
        run: python main.py

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitor-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
